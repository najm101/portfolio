<!DOCTYPE html>
<html lang="en">
<!-- include: partials/head.html -->
<body id="top" class="story-page">
  <a href="#main-content" class="skip-link">Skip to story</a>
  <div class="reading-progress" aria-hidden="true"><span data-reading-progress></span></div>

  <!-- include: partials/header.html -->

  <main id="main-content">
    <header class="story-hero">
      <div class="story-hero__glow" aria-hidden="true"></div>
      <div class="container-x story-hero__inner">
        <a href="{{HOME_URL}}#challenges" class="back-link">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M19 12H5M11 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          All selected challenges
        </a>
        <p class="eyebrow">{{STORY_THEME}}</p>
        <h1>{{STORY_TITLE}}</h1>
        <p class="story-hero__lead">{{STORY_LEAD}}</p>
        <div class="chip-list">{{STORY_TAGS}}</div>
      </div>
    </header>

    <div class="container-x story-shell">
      <aside class="story-aside" aria-label="Story navigation">
        <nav class="story-toc story-toc--desktop" aria-label="On this page">{{STORY_TOC}}</nav>
        <details class="story-toc-mobile">
          <summary>
            <span>On this page</span>
            <span class="disclosure-icon" aria-hidden="true"></span>
          </summary>
          <nav aria-label="Story sections">{{STORY_TOC}}</nav>
        </details>
      </aside>

      <article class="story-content" data-story-content>{{STORY_CONTENT}}</article>

      <div class="story-return">
        <a href="{{HOME_URL}}#challenges" class="back-link">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M19 12H5M11 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          Back to selected challenges
        </a>
      </div>
    </div>
  </main>

  <!-- include: partials/contact.html -->
  <!-- include: partials/scripts.html -->
</body>
</html>
