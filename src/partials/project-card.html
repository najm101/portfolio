<article id="project-{{SLUG}}" class="project-anchor">
  <details class="responsive-disclosure project-case {{ORIENTATION_CLASS}}" data-responsive-disclosure data-disclosure-group="projects">
    <summary class="project-case__summary">
      <span class="project-case__number">{{NUMBER}}</span>
      <span class="project-case__identity">
        <span class="project-case__eyeline"><span>{{CATEGORY}}</span>{{STATUS_PILL}}</span>
        <h3>{{NAME}}</h3>
        <span class="project-case__tagline">{{TAGLINE}}</span>
      </span>
      <span class="project-case__period">{{PERIOD}}</span>
      <span class="disclosure-icon" aria-hidden="true"></span>
    </summary>

    <div class="project-case__body">
      <div class="project-copy">
        <p class="project-copy__blurb">{{BLURB}}</p>
        {{POINTS}}
        <div class="chip-list">{{TAGS}}</div>
        <div class="badge-list">{{STORES}}</div>
        {{STORY_LINKS}}
      </div>

      <div class="project-media">
        <div class="gallery-shell">
          <div class="gallery" role="region" aria-label="{{NAME}} screenshots" tabindex="0" data-gallery>
            {{GALLERY}}
          </div>
          <div class="gallery-toolbar">
            <p aria-live="polite">
              <span data-gallery-count><span data-gallery-current>1</span> / {{GALLERY_COUNT}}</span>
              <span data-gallery-static-label>{{GALLERY_COUNT}} screens</span>
            </p>
            <div>
              <button type="button" data-gallery-prev aria-label="Previous {{NAME}} screenshot">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
              </button>
              <button type="button" data-gallery-next aria-label="Next {{NAME}} screenshot">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </details>
</article>
