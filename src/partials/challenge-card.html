<article class="challenge-case {{GRID_CLASS}}">
  <details class="responsive-disclosure challenge-disclosure" data-responsive-disclosure data-disclosure-group="challenges">
    <summary>
      <span class="challenge-disclosure__meta">
        <span class="case-number">{{NUMBER}}</span>
        <span class="case-theme">{{THEME}}</span>
      </span>
      <span class="challenge-disclosure__title-row">
        <h3>{{TITLE}}</h3>
        <span class="disclosure-icon" aria-hidden="true"></span>
      </span>
    </summary>
    <div class="challenge-disclosure__body">
      <p>{{SUMMARY}}</p>
      <div class="chip-list">{{TAGS}}</div>
      <a href="{{URL}}" class="text-link" aria-label="Read {{TITLE}}">
        Read the story
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </a>
    </div>
  </details>
</article>
