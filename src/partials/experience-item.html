<article class="experience-item">
  <details class="responsive-disclosure experience-disclosure" data-responsive-disclosure data-disclosure-group="experience">
    <summary>
      <span class="experience-disclosure__period">{{PERIOD}}</span>
      <span class="experience-disclosure__identity">
        <h3>{{COMPANY}}</h3>
        <span>{{ROLE}}</span>
      </span>
      <span class="experience-disclosure__location">{{LOCATION}}</span>
      <span class="disclosure-icon" aria-hidden="true"></span>
    </summary>
    <div class="experience-disclosure__body">{{POINTS}}</div>
  </details>
</article>
