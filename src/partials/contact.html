<footer id="contact" class="site-footer">
  <div class="container-x">
    <div class="site-footer__lead">
      <div>
        <p class="eyebrow">Contact</p>
        <h2>Let's build something<br class="hidden sm:block" /> worth shipping.</h2>
      </div>
      <p>
        Open to mobile engineering roles and selected full-stack work. The fastest way to reach me is email.
      </p>
    </div>

    <div class="contact-grid">
      <a href="mailto:{{EMAIL}}">
        <span>Email</span>
        <strong>{{EMAIL}}</strong>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
      </a>
      <a href="{{LINKEDIN}}" target="_blank" rel="noopener">
        <span>Connect</span>
        <strong>LinkedIn</strong>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
      </a>
      <a href="{{GITHUB}}" target="_blank" rel="noopener">
        <span>Code</span>
        <strong>GitHub</strong>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
      </a>
      <a href="tel:{{PHONE_HREF}}">
        <span>Call</span>
        <strong>{{PHONE}}</strong>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
      </a>
    </div>

    <div class="site-footer__base">
      <p>{{NAME}}<span aria-hidden="true">.</span></p>
      <p>© {{YEAR}} {{NAME}} · {{HEADLINE}}</p>
    </div>
  </div>
</footer>
